<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Watchdog Reports — Mansi Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .guard{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
    .guard-card,.report-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px}
    .guard-card{width:min(420px,100%)}
    .report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}
    .metric{background:var(--bg-input);border-radius:12px;padding:16px}
    .metric strong{font-size:1.5rem;display:block;color:var(--primary)}
  </style>
</head>
<body>


  <nav class="navbar">
    <a class="nav-logo" href="index.html">👑 Mansi Admin</a>
    <div class="nav-right">
      <a href="products.html" class="btn-outline">Products</a>
      <a href="orders.html" class="btn-outline">Orders</a>
      <button class="btn-outline" onclick="logoutAdmin()">Logout</button>
    </div>
  </nav>

  <main id="admin-content" style="display:none;max-width:1100px;margin:32px auto;padding:0 20px">
    <div class="report-card">
      <h1>Server Watchdog Reports</h1>
      <p style="color:var(--text-muted);margin-top:8px">Reports are generated only at 09:00 and 21:00 IST by Vercel Cron. Opening this page never triggers or sends a report.</p>
      <div class="report-grid" id="latest-metrics"></div>
      <div style="overflow:auto">
        <table class="admin-table">
          <thead><tr><th>Time (IST)</th><th>Status</th><th>Website Products</th><th>Sheet Products</th><th>Orders</th><th>Backup Queue</th><th>Telegram</th></tr></thead>
          <tbody id="reports-body"><tr><td colspan="7">Loading verified server reports…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    loadTheme();
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    async function authorize() {
      const session = await AdminSession.requireAdminPage();
      if (session) {
        const authModal = document.getElementById("admin-auth");
        if (authModal) authModal.style.display = "none";
        const content = document.getElementById("admin-content");
        if (content) content.style.display = "block";
        loadReports();
      }
    }
    async function logoutAdmin(e) {
      if (e) e.preventDefault();
      await AdminSession.logout();
      window.location.href = "index.html";
    }
    async function loadReports() {
      const body = document.getElementById("reports-body");
      try {
        const result = await StoreApi.getWatchdogReports();
        const reports = result.reports || [];
        const latest = reports[0];
        document.getElementById("latest-metrics").innerHTML = latest ? [
          ["Status", latest.status],
          ["Products", latest.activeProducts],
          ["Sheet Backup", latest.sheetProducts ?? "Unavailable"],
          ["Retry Queue", latest.backupOutbox]
        ].map(([label,value]) => `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("") : "<p>No scheduled report has run yet.</p>";
        body.innerHTML = reports.length ? reports.map(report => `<tr><td>${esc(new Date(report.createdAt).toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}))}</td><td>${esc(report.status)}</td><td>${esc(report.activeProducts)}</td><td>${esc(report.sheetProducts ?? "—")}</td><td>${esc(report.orders)}</td><td>${esc(report.backupOutbox)}</td><td>${report.telegramSent ? "Sent" : "Not sent"}</td></tr>`).join("") : '<tr><td colspan="7">No reports yet.</td></tr>';
      } catch (error) {
        body.innerHTML = `<tr><td colspan="7">Could not load reports: ${esc(error.message)}</td></tr>`;
      }
    }
    authorize();
  </script>
</body>
</html>
