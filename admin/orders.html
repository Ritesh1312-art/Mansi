<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Orders — Mansi Jewellery & Cosmetics</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .admin-auth-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .admin-auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
      text-align: center;
    }
  </style>
</head>
<body>



  <div id="admin-content" style="display: none;">
    <div class="admin-layout">
      <!-- SIDEBAR -->
      <aside class="admin-sidebar">
        <div class="brand">⚙️ Admin Panel</div>
        <div class="brand-sub">Mansi Jewellery</div>
        <nav>
          <a href="index.html" class="admin-nav-item">📊 Dashboard</a>
          <a href="products.html" class="admin-nav-item">🛍️ Products</a>
          <a href="orders.html" class="admin-nav-item active">📦 Orders</a>
          <a href="watchdog.html" class="admin-nav-item">🛡️ Watchdog</a>
          <a href="settings.html" class="admin-nav-item">⚙️ Settings</a>
          <a href="../index.html" class="admin-nav-item">🏠 View Store</a>
          <a href="#" onclick="logoutAdmin()" class="admin-nav-item" style="color:var(--error); margin-top: 20px;">🚪 Logout</a>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="admin-main">
        <div class="admin-header" style="flex-wrap: wrap; gap: 16px;">
          <div>
            <h1>📦 All Orders</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Track and update customer order status</p>
          </div>
          <div>
            <select id="status-filter" class="form-input" style="padding: 10px 16px; width: auto;" onchange="renderOrdersTable()">
              <option value="all">All Orders</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <!-- ORDERS TABLE -->
        <div style="background: var(--bg-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Contact</th>
                <th>Items (Qty)</th>
                <th>Total Value</th>
                <th>Del. Charge</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-orders-list">
              <!-- Dynamic -->
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    loadTheme();

    async function checkAdminAuth() {
      const session = await AdminSession.requireAdminPage();
      if (session) {
        const authModal = document.getElementById("admin-auth");
        if (authModal) authModal.style.display = "none";
        const content = document.getElementById("admin-content");
        if (content) content.style.display = "block";
        renderOrdersTable();
      }
    }

    async function logoutAdmin(e) {
      if (e) e.preventDefault();
      await AdminSession.logout();
      window.location.href = "index.html";
    }

    async function renderOrdersTable() {
      const filter = document.getElementById("status-filter").value;
      let orders = [];
      try {
        const result = await StoreApi.getOrders("admin");
        orders = result.orders || [];
        DB.saveOrders(orders);
      } catch (error) {
        console.error("Admin orders load failed:", error);
        orders = DB.getOrders();
      }
      const list = document.getElementById("admin-orders-list");

      const filtered = filter === "all" ? orders : orders.filter(o => o.status === filter);

      if (filtered.length === 0) {
        list.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--text-muted);padding:20px;">No orders found.</td></tr>`;
        return;
      }

      const allowedStatuses = new Set(["pending", "confirmed", "processing", "shipped", "delivered", "cancelled"]);
      list.innerHTML = filtered.map(o => {
        const status = allowedStatuses.has(o.status) ? o.status : "pending";
        let badgeClass = "badge-warning";
        if (status === "confirmed") badgeClass = "badge-info";
        if (status === "processing") badgeClass = "badge-info";
        if (status === "shipped") badgeClass = "badge-warning";
        if (status === "delivered") badgeClass = "badge-success";
        if (status === "cancelled") badgeClass = "badge-error";

        const items = Array.isArray(o.items) ? o.items : [];
        const itemsCount = items.reduce((sum, item) => sum + Math.max(0, Number(item.qty) || 0), 0);
        const itemsList = items.map(item => `${item.name || "Product"} (x${Math.max(0, Number(item.qty) || 0)})`).join(", ");
        const address = o.address && typeof o.address === "object" ? o.address : {};
        const orderId = String(o.id || "").replace(/[^A-Za-z0-9_-]/g, "");
        const phone = String(o.phone || "").replace(/[^0-9+]/g, "");
        const telegramUsername = String(STORE.telegramUsername || "MansiJewellery").replace(/^@/, "").replace(/[^A-Za-z0-9_]/g, "");
        const createdAt = new Date(o.createdAt);
        const dateLabel = Number.isNaN(createdAt.getTime()) ? "—" : `${createdAt.toLocaleDateString()} ${createdAt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        return `
          <tr>
            <td><strong>${escapeHTML(orderId)}</strong></td>
            <td>
              <div style="font-weight:700;">${escapeHTML(o.customerName || "Customer")}</div>
              <div style="font-size:0.75rem;color:var(--text-muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHTML([address.house, address.street, address.city, address.state, address.pincode].filter(Boolean).join(", "))}">
                📍 ${escapeHTML(address.city || "—")}, ${escapeHTML(address.pincode || "—")}
              </div>
            </td>
            <td>
              <a href="tel:${phone}" style="color:var(--primary);">${escapeHTML(phone || "—")}</a>
            </td>
            <td>
              <span title="${escapeHTML(itemsList)}" style="cursor:help;border-bottom:1px dashed var(--text-light);">${itemsCount} Item(s)</span>
            </td>
            <td style="color:var(--primary);font-weight:700;">₹${Math.max(0, Number(o.grandTotal) || 0).toFixed(2)}</td>
            <td style="color:var(--text-muted);">₹${Math.max(0, Number(o.deliveryCharge) || 0).toFixed(2)}</td>
            <td><span style="font-size:0.75rem;padding:3px 6px;background:var(--bg-input);border-radius:4px;font-weight:700;">${escapeHTML(String(o.paymentMode || "unknown").toUpperCase())}</span></td>
            <td>
              <span class="badge ${badgeClass}">${status.toUpperCase()}</span>
              ${o.cancelReason ? `<div style="font-size:0.7rem;color:var(--error);margin-top:2px;">Reason: ${escapeHTML(o.cancelReason)}</div>` : ''}
            </td>
            <td style="font-size:0.78rem;color:var(--text-muted);">${escapeHTML(dateLabel)}</td>
            <td>
              <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                <select data-order-id="${escapeHTML(orderId)}" class="form-input order-status-select" style="padding:6px 10px;font-size:0.78rem;width:auto;">
                  <option value="pending" ${status === "pending" ? "selected" : ""}>Pending</option>
                  <option value="confirmed" ${status === "confirmed" ? "selected" : ""}>Confirmed</option>
                  <option value="shipped" ${status === "shipped" ? "selected" : ""}>Shipped</option>
                  <option value="delivered" ${status === "delivered" ? "selected" : ""}>Delivered</option>
                  <option value="cancelled" ${status === "cancelled" ? "selected" : ""}>Cancelled</option>
                </select>
                <a href="https://t.me/${telegramUsername}" target="_blank" rel="noopener" class="btn-outline" style="padding:6px 10px;font-size:0.75rem;border-color:#0088cc;color:#0088cc;text-decoration:none;display:inline-flex;align-items:center;border-radius:10px;font-weight:600;">
                  ✈️ Telegram
                </a>
                ${status === "delivered" ? `
                  <button data-order-id="${escapeHTML(orderId)}" class="btn-outline archive-order-btn" style="padding:6px 10px;font-size:0.75rem;border-color:var(--error);color:var(--error);border-radius:10px;font-weight:700;cursor:pointer;" title="Archive Delivered Order Record">
                    📦 Archive
                  </button>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join("");
      list.querySelectorAll(".order-status-select").forEach(select => {
        select.addEventListener("change", () => updateStatus(select.dataset.orderId, select.value));
      });
      list.querySelectorAll(".archive-order-btn").forEach(button => {
        button.addEventListener("click", () => deleteDeliveredOrder(button.dataset.orderId));
      });
    }

    async function updateStatus(orderId, newStatus) {
      try {
        await StoreApi.updateOrderStatus(orderId, newStatus);
        await renderOrdersTable();
        Cart.showToast("Order status updated securely.");
      } catch (error) {
        alert("Status update failed. " + error.message);
        await renderOrdersTable();
      }
    }

    async function deleteDeliveredOrder(orderId) {
      if (!confirm(`Archive delivered order #${orderId}? The record remains recoverable.`)) return;
      try {
        await StoreApi.archiveOrder(orderId);
        await renderOrdersTable();
        Cart.showToast(`📦 Delivered order #${orderId} archived safely.`);
      } catch (error) {
        alert("Archive failed. Nothing was removed. " + error.message);
      }
    }

    // Run auth check
    checkAdminAuth();
  </script>
</body>
</html>
