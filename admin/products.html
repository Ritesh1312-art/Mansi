<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Products — Mansi Jewellery & Cosmetics</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .admin-auth-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .admin-auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
      text-align: center;
    }
  </style>
</head>
<body>



  <div id="admin-content" style="display: none;">
    <div class="admin-layout">
      <!-- SIDEBAR -->
      <aside class="admin-sidebar">
        <div style="font-size: 1.5rem; font-weight: 900; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px;">
          <span>🛍️</span> Mansi Admin
        </div>
        <nav>
          <a href="index.html" class="admin-nav-item">📊 Dashboard</a>
          <a href="products.html" class="admin-nav-item active">🛍️ Products</a>
          <a href="orders.html" class="admin-nav-item">📦 Orders</a>
          <a href="watchdog.html" class="admin-nav-item">🛡️ Watchdog</a>
          <a href="settings.html" class="admin-nav-item">⚙️ Settings</a>
          <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);">
            <a href="../index.html" class="admin-nav-item">🏠 View Store</a>
            <a href="#" onclick="logoutAdmin()" class="admin-nav-item" style="color: var(--error);">🚪 Logout</a>
          </div>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="admin-main">
        <div class="admin-header" style="flex-wrap: wrap; gap: 16px;">
          <div>
            <h1>🛍️ Manage Products</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Products save to Firebase and mirror to Google Sheet automatically.</p>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button onclick="openAddModal()" class="btn-primary" style="padding: 10px 18px; font-size: 0.88rem;">➕ Add Product</button>
            <button onclick="backupProductsNow()" class="btn-outline" style="padding: 10px 18px; font-size: 0.88rem; border-width: 1.5px;">☁️ Backup Now</button>
            <button onclick="previewAndRestore()" class="btn-outline" style="padding: 10px 18px; font-size: 0.88rem; border-width: 1.5px;">♻️ Preview / Restore</button>
            <button onclick="SheetSync.exportToCSV()" class="btn-outline" style="padding: 10px 18px; font-size: 0.88rem; border-width: 1.5px;">📤 Export CSV</button>
          </div>
        </div>

        <div id="backup-status" style="margin:16px 0;padding:12px 16px;border:1px solid var(--border);border-radius:10px;color:var(--text-muted);font-size:.86rem;">Backup status will appear here.</div>

        <!-- SEARCH BAR -->
        <div class="search-bar-container" style="margin-bottom: 20px;">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="product-search" placeholder="Search by name or category..." oninput="renderProductsTable()"/>
        </div>

        <!-- PRODUCTS TABLE -->
        <div style="background: var(--bg-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>MRP</th>
                <th>Stock</th>
                <th>Sales</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-list">
              <!-- Dynamic -->
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Add New Product</h3>
        <button class="modal-close" onclick="closeProductModal()">×</button>
      </div>
      <form id="product-form" onsubmit="saveProduct(event)">
        <input type="hidden" id="p-id" />
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" id="p-name" class="form-input" required placeholder="e.g. Designer Gold Necklace"/>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="p-category" class="form-input" required>
              <!-- Dynamic -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Stock Qty *</label>
            <input type="number" id="p-stock" class="form-input" required value="10" min="0"/>
          </div>
          <div class="form-group">
            <label class="form-label">Selling Price (₹) *</label>
            <input type="number" id="p-price" class="form-input" required min="0"/>
          </div>
          <div class="form-group">
            <label class="form-label">MRP (₹) *</label>
            <input type="number" id="p-mrp" class="form-input" required min="0"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Product Image *</label>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="file" id="p-image-file" class="form-input" accept="image/*" onchange="handleImageUpload(this)"/>
            <input type="url" id="p-image" class="form-input" placeholder="Or paste image URL..."/>
            <div style="display: flex; gap: 10px; align-items: center;">
              <img id="p-image-preview" style="display:none; width: 60px; height: 60px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover;" />
              <span id="p-image-status" style="font-size: 0.78rem; color: var(--text-muted);"></span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <label class="form-label" style="margin:0;">Description</label>
            <button type="button" class="btn-outline" id="ai-desc-btn" onclick="generateAiDescription()" style="font-size:0.75rem;padding:4px 10px;border-color:var(--primary);color:var(--primary);border-radius:6px;font-weight:700;display:flex;align-items:center;gap:4px;">
              ✨ Auto-Generate with Gemini AI
            </button>
          </div>
          <textarea id="p-desc" class="form-input" rows="4" placeholder="Briefly describe your product..."></textarea>
        </div>
        <button type="submit" class="btn-full" style="margin-top: 10px;" id="btn-save-submit">Save Product</button>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/app.js"></script>
  <script>
    loadTheme();

    function checkAdminAuth() {
      if (localStorage.getItem("adminAuth") === "true") {
        const authModal = document.getElementById("admin-auth");
        if (authModal) authModal.style.display = "none";
        const content = document.getElementById("admin-content");
        if (content) content.style.display = "block";
        initProductsPage();
      } else {
        window.location.href = "index.html";
      }
    }

    function logoutAdmin(e) {
      if (e) e.preventDefault();
      localStorage.removeItem("adminAuth");
      window.location.href = "index.html";
    }

    function initProductsPage() {
      // Load categories select list
      const select = document.getElementById("p-category");
      select.innerHTML = CATEGORIES.filter(c => c.id !== "all").map(c => `
        <option value="${c.id}">${c.name}</option>
      `).join("");

      // Render Table
      renderProductsTable();
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.toString().replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function renderProductsTable() {
      const query = document.getElementById("product-search").value.toLowerCase().trim();
      const products = DB.getProducts();
      const list = document.getElementById("admin-products-list");

      const filtered = products.filter(p =>
        String(p.name || "").toLowerCase().includes(query) ||
        String(p.category || "").toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;">No matching products found.</td></tr>`;
        return;
      }

      list.innerHTML = filtered.map(p => {
        const safeName = escapeHTML(p.name || "Product");
        const productId = String(p.id || "").replace(/[^A-Za-z0-9_-]/g, "");
        return `
        <tr>
          <td><img src="${escapeHTML(safeImageUrl(p.image))}" class="table-img" alt="${safeName}" onerror="this.src='../assets/brand/icon.svg'" /></td>
          <td><strong>${safeName}</strong></td>
          <td><span style="font-size:0.75rem;padding:3px 6px;background:var(--primary-light);color:var(--primary-dark);border-radius:4px;font-weight:700;">${escapeHTML(String(p.category || "uncategorised").toUpperCase())}</span></td>
          <td style="font-weight:700;">₹${Math.max(0, Number(p.price) || 0).toFixed(2)}</td>
          <td style="color:var(--text-light);text-decoration:line-through;font-size:0.8rem;">₹${Math.max(0, Number(p.mrp) || 0).toFixed(2)}</td>
          <td>${Math.max(0, Number(p.stock) || 0)}</td>
          <td><strong>${Math.max(0, Number(p.sales) || 0)}</strong></td>
          <td>
            <div style="display:flex;gap:6px;">
              <button data-product-id="${productId}" class="btn-outline edit-product-btn" style="padding:6px 10px;font-size:0.75rem;border-color:var(--primary);color:var(--primary);">✏️ Edit</button>
              <button data-product-id="${productId}" class="btn-outline archive-product-btn" style="padding:6px 10px;font-size:0.75rem;border-color:var(--error);color:var(--error);">📦 Archive</button>
            </div>
          </td>
        </tr>`;
      }).join("");
      list.querySelectorAll(".edit-product-btn").forEach(button => button.addEventListener("click", () => openEditModal(button.dataset.productId)));
      list.querySelectorAll(".archive-product-btn").forEach(button => button.addEventListener("click", () => deleteProduct(button.dataset.productId)));
    }

    let uploadedImageBase64 = "";

    // ✅ Remove near-white / near-light background from uploaded image
    function removeBackground(ctx, width, height) {
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;

      // Sample background color from 4 corners
      function getCornerColor(x, y) {
        const i = (y * width + x) * 4;
        return [data[i], data[i+1], data[i+2]];
      }
      const corners = [
        getCornerColor(0, 0),
        getCornerColor(width-1, 0),
        getCornerColor(0, height-1),
        getCornerColor(width-1, height-1)
      ];
      // Average corner colors to estimate background
      const bgR = Math.round(corners.reduce((s,c) => s+c[0], 0) / 4);
      const bgG = Math.round(corners.reduce((s,c) => s+c[1], 0) / 4);
      const bgB = Math.round(corners.reduce((s,c) => s+c[2], 0) / 4);

      // Tolerance: how similar to background = transparent
      const TOLERANCE = 40;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const diffR = Math.abs(r - bgR);
        const diffG = Math.abs(g - bgG);
        const diffB = Math.abs(b - bgB);

        if (diffR < TOLERANCE && diffG < TOLERANCE && diffB < TOLERANCE) {
          // Make pixel transparent
          data[i+3] = 0;
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    async function downscaleImage(file, maxDimension = 800) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.width, h = img.height;
          if (w > maxDimension || h > maxDimension) {
            if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
            else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => resolve(blob || file), "image/jpeg", 0.88);
        };
        img.onerror = () => resolve(file);
        img.src = url;
      });
    }

    async function handleImageUpload(input) {
      const file = input.files[0];
      const status = document.getElementById("p-image-status");
      const preview = document.getElementById("p-image-preview");

      if (!file) return;
      if (!file.type.startsWith("image/")) {
        status.textContent = "❌ Please choose an image file.";
        return;
      }

      status.textContent = "⚡ Processing image instantly...";
      status.style.color = "var(--primary)";
      try {
        const optimizedFile = await downscaleImage(file, 800);
        const objectUrl = URL.createObjectURL(optimizedFile);
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = objectUrl;
        });

        const scale = Math.min(620 / img.width, 620 / img.height, 1);
        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));
        const subjectCanvas = document.createElement("canvas");
        subjectCanvas.width = width;
        subjectCanvas.height = height;
        const subjectContext = subjectCanvas.getContext("2d", { willReadFrequently: true });
        subjectContext.drawImage(img, 0, 0, width, height);
        removeBackground(subjectContext, width, height);

        const canvas = document.createElement("canvas");
        canvas.width = 700;
        canvas.height = 700;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(subjectCanvas, Math.round((700 - width) / 2), Math.round((700 - height) / 2));
        URL.revokeObjectURL(objectUrl);

        uploadedImageBase64 = canvas.toDataURL("image/jpeg", 0.88);
        preview.src = uploadedImageBase64;
        preview.style.display = "block";
        preview.style.background = "#ffffff";
        preview.style.borderRadius = "8px";
        status.textContent = "✅ Royal white product image ready.";
        status.style.color = "var(--success)";
        document.getElementById("p-image").value = "";
      } catch (error) {
        console.error("Image processing failed:", error);
        status.textContent = "❌ Image processing failed. Please choose another image.";
        status.style.color = "var(--error)";
      }
    }

    // Modal Control
    function openAddModal() {
      document.getElementById("modal-title").textContent = "Add New Product";
      document.getElementById("p-id").value = "";
      document.getElementById("product-form").reset();
      uploadedImageBase64 = "";
      document.getElementById("p-image-preview").style.display = "none";
      document.getElementById("p-image-status").textContent = "";
      document.getElementById("p-image-file").value = "";
      document.getElementById("product-modal").classList.add("open");
    }

    function openEditModal(id) {
      const p = DB.getProductById(id);
      if (!p) return;
      document.getElementById("modal-title").textContent = "Edit Product";
      document.getElementById("p-id").value = p.id;
      document.getElementById("p-name").value = p.name;
      document.getElementById("p-category").value = p.category;
      document.getElementById("p-stock").value = p.stock || 10;
      document.getElementById("p-price").value = p.price;
      document.getElementById("p-mrp").value = p.mrp || p.price;
      document.getElementById("p-image").value = p.image && !p.image.startsWith("data:") ? p.image : "";
      
      const preview = document.getElementById("p-image-preview");
      if (p.image) {
        preview.src = p.image;
        preview.style.display = "block";
        uploadedImageBase64 = p.image.startsWith("data:") ? p.image : "";
      } else {
        preview.style.display = "none";
        uploadedImageBase64 = "";
      }
      document.getElementById("p-image-status").textContent = "";
      document.getElementById("p-image-file").value = "";
      document.getElementById("p-desc").value = p.description || "";
      document.getElementById("product-modal").classList.add("open");
    }

    function closeProductModal() {
      document.getElementById("product-modal").classList.remove("open");
    }

    async function saveProduct(e) {
      e.preventDefault();
      const saveBtn = document.querySelector("#product-modal button[type='submit']");
      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "⏳ Saving..."; }

      try {
        const id = document.getElementById("p-id").value;
        const urlImage = document.getElementById("p-image").value.trim();
        const finalImage = uploadedImageBase64 || urlImage || "";

        const name = document.getElementById("p-name").value.trim();
        const price = parseFloat(document.getElementById("p-price").value);
        const mrp = parseFloat(document.getElementById("p-mrp").value);

        if (!name) { alert("⚠️ Product name is required!"); return; }
        if (!price || price <= 0) { alert("⚠️ Selling price is required!"); return; }

        const data = {
          name,
          category: document.getElementById("p-category").value,
          stock: parseInt(document.getElementById("p-stock").value) || 0,
          price,
          mrp: mrp || price,
          image: finalImage,
          description: document.getElementById("p-desc").value.trim()
        };

        if (id) {
          DB.updateProduct(id, data);
          Cart.showToast("✅ Product updated successfully!");
        } else {
          const added = DB.addProduct(data);
          if (window.Watchdog) Watchdog.updateBaseline(DB.getProducts().length);
          Cart.showToast("✅ Product added & synced to Cloud!");
        }

        uploadedImageBase64 = "";
        document.getElementById("p-id").value = "";
        document.getElementById("p-image").value = "";
        document.getElementById("p-image-file").value = "";
        document.getElementById("p-image-preview").style.display = "none";
        document.getElementById("p-desc").value = "";

        closeProductModal();
        window.dispatchEvent(new Event("productsSynced"));
        renderProductsTable();
      } catch (err) {
        console.error("Error saving product:", err);
        alert("⚠️ Save error: " + (err.message || err));
      } finally {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "💾 Save Product"; }
      }
    }

    async function generateAiDescription() {
      const name = document.getElementById("p-name").value.trim();
      const cat = document.getElementById("p-category").value;
      const descField = document.getElementById("p-desc");
      const btn = document.getElementById("ai-desc-btn");

      if (!name) {
        alert("⚠️ Please enter a Product Name first so Gemini AI knows what to write!");
        return;
      }

      const apiKey = (STORE.geminiApiKey || (typeof defaultStore !== "undefined" && defaultStore.geminiApiKey) || "").trim();
      if (!apiKey) {
        alert("⚠️ Gemini API Key is missing!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "✨ Generating AI Description...";
      try {
        const promptText = `Write a short, highly attractive, professional 2-3 sentence product description in friendly Hinglish for an e-commerce store called Mansi Jewellery & Cosmetics. Product Name: "${name}", Category: "${cat}". Highlight quality, elegance, and why customers will love buying it. Do not include markdown headers or quotes.`;
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });
        const json = await res.json();
        const generated = json.candidates?.[0]?.content?.parts?.[0]?.text;
        if (generated) {
          descField.value = generated.trim();
          Cart.showToast("✨ AI Description generated successfully!");
        } else {
          alert("⚠️ AI Description could not be generated. Please try again.");
        }
      } catch (err) {
        console.error("Gemini AI API Error:", err);
        alert("⚠️ Gemini AI Error: " + (err.message || err));
      } finally {
        btn.disabled = false;
        btn.textContent = "✨ Auto-Generate with Gemini AI";
      }
    }

    function deleteProduct(id) {
      if (confirm("⚠️ Are you sure you want to delete this product?")) {
        DB.deleteProduct(id);
        Cart.showToast("Product deleted successfully.");
        renderProductsTable();
      }
    }

    async function backupProductsNow() {
      const status = document.getElementById("backup-status");
      status.textContent = "Backing up all products…";
      try {
        const result = await SheetSync.backupNow();
        status.textContent = `✅ Backup complete: ${result.updated} updated, ${result.appended} added, ${result.total} total.`;
      } catch (error) {
        status.textContent = "⚠️ Backup failed; no product was removed. " + error.message;
      }
    }

    async function previewAndRestore() {
      const status = document.getElementById("backup-status");
      status.textContent = "Comparing Firebase with Google Sheet…";
      try {
        const preview = await SheetSync.previewRestore();
        status.textContent = `Preview: ${preview.creates} missing, ${preview.updates} newer, ${preview.unchanged} unchanged, 0 deletes.`;
        if ((preview.creates || preview.updates) && confirm(`Merge ${preview.creates + preview.updates} recoverable product(s)? Nothing will be deleted.`)) {
          const result = await SheetSync.restoreMerge();
          status.textContent = `✅ Restore merged: ${result.creates} created, ${result.updates} updated, 0 deleted.`;
        }
      } catch (error) {
        status.textContent = "⚠️ Restore preview failed; nothing changed. " + error.message;
      }
    }

    // Run auth check
    checkAdminAuth();
  </script>
</body>
</html>
