<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — Mansi Jewellery & Cosmetics</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 60px 5%; max-width: 1300px; margin: 0 auto; }
    .detail-img-container { background: var(--bg-soft); aspect-ratio: 3/4; overflow: hidden; border-radius: 8px; }
    .detail-img-container img { width: 100%; height: 100%; object-fit: contain; }
    .detail-info { padding-top: 20px; }
    .detail-category { text-transform: uppercase; letter-spacing: 3px; font-size: 0.75rem; color: var(--text-light); margin-bottom: 12px; }
    .detail-title { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 800; margin-bottom: 16px; line-height: 1.2; }
    .detail-price { font-size: 1.5rem; font-weight: 600; margin-bottom: 24px; color: var(--primary); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .detail-desc { color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem; line-height: 1.8; }
    .detail-btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .detail-btn-group button, .detail-btn-group a {
      padding: 14px 28px; border-radius: 10px; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px; border: none;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn-add-bag { background: var(--bg-card); color: var(--primary); border: 2px solid var(--primary) !important; }
    .btn-buy-now { background: var(--primary); color: #fff; }
    .btn-telegram { background: #0088cc; color: #fff; }
    @media (max-width: 768px) {
      .detail-grid { grid-template-columns: 1fr; gap: 28px; padding: 24px 5%; }
      .detail-btn-group button, .detail-btn-group a { padding: 12px 18px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a class="nav-logo" href="index.html">
      <div class="nav-logo-icon">💍</div>
      <div class="nav-logo-text"><span>Mansi</span> Jewellery</div>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link">Collections</a>
    </div>
    <div class="nav-right">
      <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-count" style="display:none;">0</span></a>
      <div id="user-area" style="display:flex;gap:8px;align-items:center;"></div>
    </div>
  </nav>

  <!-- PRODUCT DETAIL -->
  <div class="detail-grid" id="product-detail">
    <!-- Dynamic Content -->
  </div>

  <!-- FOOTER (rendered by JS) -->
  <footer class="footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderProduct();
      initNavbar();
    });

    window.addEventListener("productsSynced", () => renderProduct(true));

    async function renderProduct(isSyncEvent = false) {
      const container = document.getElementById('product-detail');

      // ✅ PRIMARY: Read product directly from sessionStorage (set by product card click)
      let p = null;
      try {
        const stored = sessionStorage.getItem('viewingProduct');
        if (stored) p = JSON.parse(stored);
      } catch(e) {}

      // ✅ FALLBACK: Try DB lookup by URL id if sessionStorage is empty
      if (!p) {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id && id !== 'undefined' && id !== 'null') {
          // Show loading
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 100px 20px;">
              <div style="font-size: 2.5rem;">💎</div>
              <h3 style="margin-top: 16px; font-weight: 600;">Loading product details...</h3>
            </div>
          `;
          // Try DB
          p = await DB.fetchProductById(id);
          // If still not found, search raw localStorage by name
          if (!p) {
            const rawProducts = JSON.parse(localStorage.getItem("products") || "[]");
            const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            const tid = norm(id);
            p = rawProducts.find(prod => prod && (norm(prod.id) === tid || norm(prod.name) === tid)) || null;
          }
        }
      }

      if (!p) {
        drawNotFound();
        return;
      }

      // Refresh sessionStorage with latest product data
      try { sessionStorage.setItem('viewingProduct', JSON.stringify(p)); } catch(e) {}

      drawProduct(p);
    }

    function drawProduct(p) {
      const tgUser = String(STORE.telegramUsername || 'MansiJewellery').replace(/^@/, '').replace(/[^A-Za-z0-9_]/g, '');
      const rating = Math.min(5, Math.max(0, parseFloat(p.rating) || 0));
      const fullStars = Math.floor(rating);
      const starsHtml = '★'.repeat(fullStars) + (rating - fullStars >= 0.5 ? '½' : '');
      const safeName = escapeHTML(p.name);
      const safeCategory = escapeHTML(p.category || "");
      const safeDescription = escapeHTML(p.description || "Product description will be updated soon.");
      const safeImage = escapeHTML(safeImageUrl(p.image));
      const safeId = safeProductId(p.id);
      const price = Math.max(0, Number(p.price) || 0);
      const mrp = Math.max(price, Number(p.mrp) || price);
      const reviews = Math.max(0, Number(p.reviews) || 0);

      document.getElementById('product-detail').innerHTML = `
        <div class="detail-img-container">
          <img src="${safeImage}" alt="${safeName}" style="background:#fff;object-fit:contain;" onerror="this.src='assets/brand/icon.svg'" />
        </div>
        <div class="detail-info">
          <div class="detail-category">${safeCategory}</div>
          <h1 class="detail-title">${safeName}</h1>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <span style="color:#f5a623;font-size:1rem;">${starsHtml}</span>
            <span style="font-size:0.85rem;font-weight:600;color:#f5a623;">${rating ? rating.toFixed(1) : "New"}</span>
            <span style="font-size:0.82rem;color:var(--text-muted);">(${reviews} reviews)</span>
          </div>
          <div class="detail-price">
            <span>₹${price}</span>
            ${mrp > price ? `<span style="font-size:1.1rem;color:var(--text-muted);text-decoration:line-through;font-weight:400;">₹${mrp}</span><span style="font-size:0.9rem;background:var(--primary);color:#fff;padding:2px 10px;border-radius:20px;font-weight:700;">${Math.round((1-price/mrp)*100)}% OFF</span>` : ''}
          </div>
          <p class="detail-desc">${safeDescription}</p>

          <div class="detail-btn-group">
            <button class="btn-add-bag" onclick="Cart.add('${safeId}');Cart.showToast('Added to cart! ✅')">🛒 Add to Cart</button>
            <button class="btn-buy-now" onclick="buyNow('${safeId}')">⚡ Buy Now</button>
            <a class="btn-telegram" href="https://t.me/${tgUser}" target="_blank" rel="noopener">✈️ Ask on Telegram</a>
          </div>

          <div style="display:flex;gap:16px;font-size:0.82rem;color:var(--text-muted);flex-wrap:wrap;">
            <span>📦 Delivery calculated at checkout</span>
            <span>🔒 Server-validated order total</span>
            <span>💳 COD on eligible orders</span>
          </div>
        </div>
      `;
    }

    // Buy Now — add to cart and go directly to checkout
    function buyNow(productId) {
      Cart.add(productId);
      setTimeout(() => { location.href = 'checkout.html'; }, 300);
    }

    function drawNotFound() {
      document.getElementById('product-detail').innerHTML = '<div style="text-align:center;padding:80px;grid-column:1/-1;"><h2>Product Not Found</h2><p style="color:var(--text-muted);margin-top:10px;">The product you are looking for does not exist.</p><a href="products.html" style="color:var(--primary);font-weight:600;margin-top:20px;display:inline-block;">Browse Collections →</a></div>';
    }
  </script>
</body>
</html>
